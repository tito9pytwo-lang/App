name: Build & Sign Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. تحميل المشروع
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v6

      # ==========================================
      # 2. البحث عن ZIP وفك الضغط
      # ==========================================
      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -name "*.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ لم يتم العثور على ملف ZIP."
            exit 1
          fi

          echo "📦 ZIP found:"
          echo "$ZIP_FILE"

          mkdir -p "$GITHUB_WORKSPACE/android-project"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/android-project"

          echo "✅ تم فك الضغط بنجاح."

      # ==========================================
      # 3. العثور على مشروع Android
      # ==========================================
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          PROJECT_ROOT=$(find \
            "$GITHUB_WORKSPACE/android-project" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print -quit \
            | xargs -r dirname)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "❌ لم يتم العثور على settings.gradle أو settings.gradle.kts"

            echo ""
            echo "محتويات المشروع:"
            find "$GITHUB_WORKSPACE/android-project" \
              -maxdepth 5 \
              -type f \
              -print

            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "✅ Android project:"
          echo "$PROJECT_ROOT"

      # ==========================================
      # 4. إنشاء ملف التوقيع الذي يطلبه المشروع
      # ==========================================
      - name: Create Release Keystore
        shell: bash
        run: |
          set -e

          KEYSTORE="$PROJECT_ROOT/my-upload-key.jks"

          echo "🔐 إنشاء:"
          echo "$KEYSTORE"

          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android, OU=Dev, O=App, L=City, S=State, C=US"

          if [ ! -f "$KEYSTORE" ]; then
            echo "❌ فشل إنشاء ملف التوقيع."
            exit 1
          fi

          echo "KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

          echo "✅ تم إنشاء keystore."

      # ==========================================
      # 5. عرض بيئة البناء
      # ==========================================
      - name: Show Build Environment
        shell: bash
        run: |
          echo "================================"
          echo "Java"
          echo "================================"

          java -version || true

          echo ""
          echo "================================"
          echo "Gradle"
          echo "================================"

          gradle --version || true

          echo ""
          echo "================================"
          echo "Android SDK"
          echo "================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      # ==========================================
      # 6. بناء Release
      # ==========================================
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash

        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: android
          KEY_ALIAS: upload
          KEY_PASSWORD: android

        run: |
          set -e

          echo "================================"
          echo "Project"
          echo "================================"

          pwd
          ls -la

          echo ""
          echo "================================"
          echo "Keystore"
          echo "================================"

          ls -lh "$KEYSTORE_PATH"

          echo ""
          echo "================================"
          echo "Building Release APK"
          echo "================================"

          # استخدام Gradle Wrapper إذا كان موجوداً
          if [ -f "./gradlew" ]; then

            echo "✅ استخدام Gradle Wrapper"

            chmod +x ./gradlew

            ./gradlew assembleRelease --no-daemon

          else

            echo "⚠️ Gradle Wrapper غير موجود."
            echo "سيتم استخدام Gradle المتاح على GitHub Runner."

            if ! command -v gradle >/dev/null 2>&1; then
              echo "❌ Gradle غير موجود على Runner."
              exit 1
            fi

            gradle assembleRelease --no-daemon

          fi

      # ==========================================
      # 7. البحث عن APK
      # ==========================================
      - name: Find Release APK
        shell: bash
        run: |
          set -e

          echo "🔎 البحث عن APK..."

          APK_PATH=$(find "$PROJECT_ROOT" \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            -print \
            | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "❌ لم يتم العثور على APK."

            echo ""
            echo "كل ملفات APK:"
            find "$PROJECT_ROOT" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

          echo "✅ APK:"
          echo "$APK_PATH"

      # ==========================================
      # 8. اكتشاف apksigner تلقائياً
      # ==========================================
      - name: Find apksigner
        shell: bash
        run: |
          set -e

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "apksigner" \
            -print \
            | sort -V \
            | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "❌ لم يتم العثور على apksigner."
            exit 1
          fi

          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"

          echo "✅ apksigner:"
          echo "$APKSIGNER"

      # ==========================================
      # 9. التحقق من توقيع APK
      # ==========================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          "$APKSIGNER" verify \
            --verbose \
            "$APK_PATH"

          echo "✅ APK صالح والتوقيع صحيح."

      # ==========================================
      # 10. رفع APK
      # ==========================================
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Signed-APK-Build-${{ github.run_number }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
