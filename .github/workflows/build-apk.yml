name: Build & Sign Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. تحميل آخر نسخة من المستودع
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. البحث عن أحدث Android Project ZIP
      #
      # يقبل:
      # android-project.zip
      # android-project1.zip
      # android-project2.zip
      # android-project3.zip
      # ...
      # ==========================================
      - name: Extract Latest Android Project
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "البحث عن أحدث ملف Android Project"
          echo "================================"

          ZIP_FILE=$(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -regextype posix-extended \
              -regex '.*/android-project[0-9]*\.zip' \
              -printf '%T@ %p\n' \
            | sort -nr \
            | head -n 1 \
            | cut -d' ' -f2-
          )

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ لم يتم العثور على ملف:"
            echo "android-project.zip"
            echo "أو android-project1.zip"
            echo "أو android-project2.zip ..."
            exit 1
          fi

          echo ""
          echo "📦 سيتم استخدام:"
          echo "$ZIP_FILE"

          # حذف أي مشروع قديم
          rm -rf "$GITHUB_WORKSPACE/android-project"

          # إنشاء مجلد نظيف
          mkdir -p "$GITHUB_WORKSPACE/android-project"

          # فك ضغط أحدث ZIP
          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/android-project"

          echo ""
          echo "✅ تم فك أحدث ZIP بنجاح."

          echo ""
          echo "📂 الملفات:"
          find "$GITHUB_WORKSPACE/android-project" \
            -maxdepth 4 \
            -type f \
            -print

      # ==========================================
      # 3. العثور على مشروع Android
      # ==========================================
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          PROJECT_ROOT=$(
            find "$GITHUB_WORKSPACE/android-project" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print -quit \
              | xargs -r dirname
          )

          if [ -z "$PROJECT_ROOT" ]; then
            echo "❌ لم يتم العثور على:"
            echo "settings.gradle"
            echo "أو settings.gradle.kts"

            echo ""
            echo "محتويات المشروع:"
            find "$GITHUB_WORKSPACE/android-project" \
              -maxdepth 6 \
              -type f \
              -print

            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo ""
          echo "✅ Android Project:"
          echo "$PROJECT_ROOT"

      # ==========================================
      # 4. إعداد Java
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 5. التحقق من Gradle Wrapper
      # ==========================================
      - name: Check Gradle
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "Gradle"
          echo "================================"

          if [ -f "./gradlew" ]; then
            echo "✅ Gradle Wrapper موجود"

            chmod +x ./gradlew

            ./gradlew --version

          else
            echo "⚠️ Gradle Wrapper غير موجود."

            if command -v gradle >/dev/null 2>&1; then
              echo "✅ سيتم استخدام Gradle الموجود في GitHub Runner"
              gradle --version
            else
              echo "❌ Gradle غير موجود."
              exit 1
            fi
          fi

      # ==========================================
      # 6. البحث عن Keystore
      #
      # إذا كان المشروع يحتوي على my-upload-key.jks
      # سيتم استخدامه.
      #
      # إذا لم يكن موجوداً سيتم إنشاء واحد.
      #
      # ملاحظة:
      # الأفضل لاحقاً نقل المفتاح إلى GitHub Secrets.
      # ==========================================
      - name: Prepare Release Keystore
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          KEYSTORE="$PROJECT_ROOT/my-upload-key.jks"

          if [ -f "$KEYSTORE" ]; then

            echo "✅ تم العثور على Keystore موجود."

          else

            echo "⚠️ لم يتم العثور على Keystore."
            echo "🔐 سيتم إنشاء Keystore جديد."

            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android, OU=Dev, O=App, L=City, S=State, C=US"

          fi

          if [ ! -f "$KEYSTORE" ]; then
            echo "❌ لم يتم إنشاء Keystore."
            exit 1
          fi

          echo "KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

          echo "✅ Keystore جاهز."

      # ==========================================
      # 7. عرض بيئة البناء
      # ==========================================
      - name: Show Build Environment
        shell: bash
        run: |
          echo "================================"
          echo "Java"
          echo "================================"

          java -version

          echo ""
          echo "================================"
          echo "Android SDK"
          echo "================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "================================"
          echo "Project"
          echo "================================"

          echo "$PROJECT_ROOT"

      # ==========================================
      # 8. بناء Release APK
      # ==========================================
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: android
          KEY_ALIAS: upload
          KEY_PASSWORD: android

        run: |
          set -e

          echo "================================"
          echo "Building Release APK"
          echo "================================"

          pwd

          echo ""
          echo "📂 محتويات المشروع:"
          ls -la

          echo ""

          if [ -f "./gradlew" ]; then

            echo "✅ استخدام Gradle Wrapper"

            chmod +x ./gradlew

            ./gradlew assembleRelease --no-daemon

          else

            echo "⚠️ استخدام Gradle الموجود في Runner"

            gradle assembleRelease --no-daemon

          fi

          echo ""
          echo "✅ انتهى بناء APK."

      # ==========================================
      # 9. العثور على APK الناتج
      # ==========================================
      - name: Find Release APK
        shell: bash
        run: |
          set -e

          echo "🔎 البحث عن APK..."

          APK_PATH=$(
            find "$PROJECT_ROOT" \
              -type f \
              -path "*/build/outputs/apk/release/*.apk" \
              -print \
            | head -n 1
          )

          if [ -z "$APK_PATH" ]; then

            echo "❌ لم يتم العثور على APK."

            echo ""
            echo "كل ملفات APK:"
            find "$PROJECT_ROOT" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

          echo ""
          echo "✅ APK:"
          echo "$APK_PATH"

      # ==========================================
      # 10. العثور على apksigner
      # ==========================================
      - name: Find apksigner
        shell: bash
        run: |
          set -e

          APKSIGNER=$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name "apksigner" \
              -print \
            | sort -V \
            | tail -n 1
          )

          if [ -z "$APKSIGNER" ]; then
            echo "❌ لم يتم العثور على apksigner."
            exit 1
          fi

          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"

          echo "✅ apksigner:"
          echo "$APKSIGNER"

      # ==========================================
      # 11. التحقق من APK
      # ==========================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          "$APKSIGNER" verify \
            --verbose \
            "$APK_PATH"

          echo ""
          echo "✅ APK صالح والتوقيع صحيح."

      # ==========================================
      # 12. إعادة تسمية APK
      # ==========================================
      - name: Rename APK
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/output"

          NEW_APK="$GITHUB_WORKSPACE/output/app-release-${{ github.run_number }}.apk"

          cp "$APK_PATH" "$NEW_APK"

          echo "FINAL_APK=$NEW_APK" >> "$GITHUB_ENV"

          echo ""
          echo "✅ APK النهائي:"
          echo "$NEW_APK"

      # ==========================================
      # 13. رفع APK
      # ==========================================
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-Build-${{ github.run_number }}
          path: ${{ env.FINAL_APK }}
          if-no-files-found: error
