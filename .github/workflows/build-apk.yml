name: Build & Sign Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # 1. Checkout
      # ==============================
      - name: Checkout Repository
        uses: actions/checkout@v6

      # ==============================
      # 2. Find ZIP and extract it
      # ==============================
      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -name "*.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ لم يتم العثور على ملف ZIP."
            exit 1
          fi

          echo "📦 ZIP:"
          echo "$ZIP_FILE"

          mkdir -p "$GITHUB_WORKSPACE/android-project"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/android-project"

          echo "✅ تم فك ZIP بنجاح."

      # ==============================
      # 3. Find Android project
      # ==============================
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          PROJECT_ROOT=$(find \
            "$GITHUB_WORKSPACE/android-project" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print -quit \
            | xargs -r dirname)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "❌ لم يتم العثور على مشروع Android."
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "✅ Project root:"
          echo "$PROJECT_ROOT"

      # ==============================
      # 4. Create release keystore
      # ==============================
      - name: Create Release Keystore
        shell: bash
        run: |
          set -e

          KEYSTORE="$PROJECT_ROOT/my-upload-key.jks"

          echo "🔐 Creating keystore:"
          echo "$KEYSTORE"

          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android, OU=Dev, O=App, L=City, S=State, C=US"

          if [ ! -f "$KEYSTORE" ]; then
            echo "❌ فشل إنشاء keystore."
            exit 1
          fi

          echo "✅ Keystore created successfully."

      # ==============================
      # 5. Show Java / Gradle info
      # ==============================
      - name: Show Build Environment
        shell: bash
        run: |
          echo "=============================="
          echo "JAVA"
          echo "=============================="

          java -version || true

          echo ""
          echo "=============================="
          echo "GRADLE"
          echo "=============================="

          gradle --version || true

          echo ""
          echo "=============================="
          echo "ANDROID SDK"
          echo "=============================="

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      # ==============================
      # 6. Build Release
      # ==============================
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo "📁 Working directory:"
          pwd

          echo ""
          echo "📂 Project:"
          ls -la

          echo ""
          echo "🔐 Checking keystore:"
          ls -lh my-upload-key.jks

          # Use Gradle Wrapper when available
          if [ -f "./gradlew" ]; then

            echo "✅ Using Gradle Wrapper."

            chmod +x ./gradlew

            ./gradlew assembleRelease --no-daemon

          else

            echo "⚠️ Gradle Wrapper not found."
            echo "Using Gradle available on GitHub Runner."

            if ! command -v gradle >/dev/null 2>&1; then
              echo "❌ Gradle غير موجود."
              exit 1
            fi

            gradle assembleRelease --no-daemon

          fi

      # ==============================
      # 7. Find APK
      # ==============================
      - name: Find Release APK
        shell: bash
        run: |
          set -e

          echo "🔎 Searching for APK..."

          APK_PATH=$(find "$PROJECT_ROOT" \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            -print \
            | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "❌ لم يتم العثور على APK."

            echo ""
            echo "APK files:"
            find "$PROJECT_ROOT" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

          echo "✅ APK found:"
          echo "$APK_PATH"

      # ==============================
      # 8. Verify APK
      # ==============================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "apksigner" \
            -print \
            | sort -V \
            | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "❌ apksigner غير موجود."
            exit 1
          fi

          echo "Using:"
          echo "$APKSIGNER"

          "$APKSIGNER" verify \
            --verbose \
            "$APK_PATH"

          echo "✅ APK signature verified."

      # ==============================
      # 9. Upload APK
      # ==============================
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Signed-APK-Build-${{ github.run_number }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
