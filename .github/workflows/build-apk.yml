name: Build & Sign Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب مشروعك من GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة Java JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. إنشاء ملف gradlew المفقود وإعطائه الصلاحية
      - name: Setup Gradle Wrapper
        run: |
          gradle wrapper
          chmod +x gradlew

      # 4. بناء الـ APK باستخدام Gradle
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # 5. إنشاء مفتاح توقيع وتوقيع الـ APK مباشرة
      - name: Sign APK
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias my-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass mypassword -keypass mypassword -dname "CN=Android, OU=Dev, O=App, L=City, S=State, C=US"
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" ! -name "*-signed.apk" | head -n 1)
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.keystore --ks-key-alias my-alias --ks-pass pass:mypassword --key-pass pass:mypassword --out app/build/outputs/apk/release/app-signed.apk $APK_PATH

      # 6. رفع ملف الـ APK الموقّع والجاهز للتثبيت
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Signed-APK-Build-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-signed.apk
          
