name: Build & Sign Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - '**.zip'
      - '**.ZIP'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. تحميل المستودع بالكامل
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # 2. إعداد Java
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 3. البحث عن أحدث ZIP تم رفعه/تعديله
      #
      # لا يعتمد على اسم ZIP إطلاقاً.
      #
      # مثال:
      #
      # old_project.zip
      # myapp_2026.zip
      # test-final.zip
      # مشروع جديد.zip
      #
      # سيتم اختيار الملف الذي كان آخر
      # ملف ZIP تم تغييره في Git.
      # ==========================================
      - name: Find Newest Uploaded ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "🔎 البحث عن أحدث ملف ZIP"
          echo "=========================================="

          ZIP_FILE=""

          LATEST_TIME=0

          # البحث عن جميع ملفات ZIP في المستودع
          while IFS= read -r -d '' FILE; do

            # الحصول على وقت آخر Commit غيّر هذا الملف
            FILE_TIME=$(git log \
              -1 \
              --format=%ct \
              -- "$FILE" || true)

            if [ -z "$FILE_TIME" ]; then
              continue
            fi

            echo "📦 ZIP: $FILE"
            echo "   آخر تعديل Git: $FILE_TIME"

            if [ "$FILE_TIME" -gt "$LATEST_TIME" ]; then
              LATEST_TIME="$FILE_TIME"
              ZIP_FILE="$FILE"
            fi

          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              \( -iname "*.zip" \) \
              -not -path "*/.git/*" \
              -print0
          )

          echo ""
          echo "=========================================="

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ لم يتم العثور على أي ملف ZIP."
            exit 1
          fi

          echo "✅ أحدث ZIP:"
          echo "$ZIP_FILE"

          echo "=========================================="

          # حفظ المسار لباقي الخطوات
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # ==========================================
      # 4. فك ضغط أحدث ZIP
      # ==========================================
      - name: Extract Newest Android Project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "📦 فك ضغط المشروع الجديد"
          echo "=========================================="

          if [ ! -f "$ZIP_FILE" ]; then
            echo "❌ ملف ZIP غير موجود:"
            echo "$ZIP_FILE"
            exit 1
          fi

          # حذف أي مشروع مستخرج سابقاً
          rm -rf "$GITHUB_WORKSPACE/android-project"

          # إنشاء مجلد نظيف
          mkdir -p "$GITHUB_WORKSPACE/android-project"

          echo "ZIP:"
          echo "$ZIP_FILE"

          echo ""

          unzip -q \
            "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/android-project"

          echo "✅ تم فك الضغط بنجاح."

          echo ""
          echo "📂 محتويات ZIP:"
          find "$GITHUB_WORKSPACE/android-project" \
            -maxdepth 5 \
            -type f \
            -print

      # ==========================================
      # 5. العثور على مشروع Android
      # ==========================================
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "🔎 البحث عن مشروع Android"
          echo "=========================================="

          PROJECT_ROOT=$(
            find "$GITHUB_WORKSPACE/android-project" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print -quit \
              | xargs -r dirname
          )

          if [ -z "$PROJECT_ROOT" ]; then

            echo "❌ لم يتم العثور على:"
            echo "settings.gradle"
            echo "أو"
            echo "settings.gradle.kts"

            echo ""
            echo "📂 محتويات المشروع:"
            find "$GITHUB_WORKSPACE/android-project" \
              -maxdepth 6 \
              -type f \
              -print

            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo ""
          echo "✅ Android Project:"
          echo "$PROJECT_ROOT"

      # ==========================================
      # 6. فحص Gradle Wrapper
      # ==========================================
      - name: Check Gradle
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "⚙️ فحص Gradle"
          echo "=========================================="

          if [ -f "./gradlew" ]; then

            echo "✅ Gradle Wrapper موجود."

            chmod +x ./gradlew

            ./gradlew --version

          else

            echo "⚠️ Gradle Wrapper غير موجود."

            if ! command -v gradle >/dev/null 2>&1; then
              echo "❌ Gradle غير موجود."
              exit 1
            fi

            echo "✅ سيتم استخدام Gradle الموجود في Runner."

            gradle --version

          fi

      # ==========================================
      # 7. إنشاء Keystore
      # ==========================================
      - name: Create Release Keystore
        shell: bash
        run: |
          set -e

          KEYSTORE="$PROJECT_ROOT/my-upload-key.jks"

          echo "=========================================="
          echo "🔐 إعداد Keystore"
          echo "=========================================="

          if [ -f "$KEYSTORE" ]; then

            echo "✅ Keystore موجود داخل المشروع."

          else

            echo "⚠️ لم يتم العثور على Keystore."
            echo "🔐 سيتم إنشاء Keystore جديد."

            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android, OU=Dev, O=App, L=City, S=State, C=US"

          fi

          if [ ! -f "$KEYSTORE" ]; then
            echo "❌ فشل إعداد Keystore."
            exit 1
          fi

          echo "KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

          echo "✅ Keystore جاهز."

      # ==========================================
      # 8. عرض بيئة البناء
      # ==========================================
      - name: Show Build Environment
        shell: bash
        run: |
          echo "=========================================="
          echo "☕ Java"
          echo "=========================================="

          java -version

          echo ""
          echo "=========================================="
          echo "📱 Android SDK"
          echo "=========================================="

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "=========================================="
          echo "📦 ZIP المستخدم"
          echo "=========================================="

          echo "$ZIP_FILE"

          echo ""
          echo "=========================================="
          echo "📂 المشروع"
          echo "=========================================="

          echo "$PROJECT_ROOT"

      # ==========================================
      # 9. بناء Release APK
      # ==========================================
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash

        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: android
          KEY_ALIAS: upload
          KEY_PASSWORD: android

        run: |
          set -e

          echo "=========================================="
          echo "🔨 بناء Release APK"
          echo "=========================================="

          pwd

          echo ""
          echo "📂 ملفات المشروع:"
          ls -la

          echo ""
          echo "=========================================="

          if [ -f "./gradlew" ]; then

            echo "✅ استخدام Gradle Wrapper"

            chmod +x ./gradlew

            ./gradlew assembleRelease --no-daemon

          else

            echo "⚠️ استخدام Gradle الموجود في Runner"

            gradle assembleRelease --no-daemon

          fi

          echo ""
          echo "=========================================="
          echo "✅ انتهى البناء"
          echo "=========================================="

      # ==========================================
      # 10. البحث عن APK الناتج
      # ==========================================
      - name: Find Release APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "🔎 البحث عن APK"
          echo "=========================================="

          APK_PATH=$(
            find "$PROJECT_ROOT" \
              -type f \
              -path "*/build/outputs/apk/release/*.apk" \
              -print \
            | head -n 1
          )

          if [ -z "$APK_PATH" ]; then

            echo "❌ لم يتم العثور على APK."

            echo ""
            echo "📂 كل ملفات APK الموجودة:"
            
            find "$PROJECT_ROOT" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

          echo ""
          echo "✅ APK:"
          echo "$APK_PATH"

      # ==========================================
      # 11. العثور على apksigner
      # ==========================================
      - name: Find apksigner
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "🔎 البحث عن apksigner"
          echo "=========================================="

          APKSIGNER=$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name "apksigner" \
              -print \
            | sort -V \
            | tail -n 1
          )

          if [ -z "$APKSIGNER" ]; then
            echo "❌ لم يتم العثور على apksigner."
            exit 1
          fi

          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"

          echo ""
          echo "✅ apksigner:"
          echo "$APKSIGNER"

      # ==========================================
      # 12. التحقق من APK
      # ==========================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "🔐 التحقق من APK"
          echo "=========================================="

          "$APKSIGNER" verify \
            --verbose \
            "$APK_PATH"

          echo ""
          echo "✅ APK صالح."

      # ==========================================
      # 13. تجهيز ملف APK النهائي
      # ==========================================
      - name: Prepare Final APK
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/output"

          FINAL_APK="$GITHUB_WORKSPACE/output/app-release-${GITHUB_RUN_NUMBER}.apk"

          cp "$APK_PATH" "$FINAL_APK"

          echo "FINAL_APK=$FINAL_APK" >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo "✅ APK النهائي"
          echo "=========================================="

          echo "$FINAL_APK"

      # ==========================================
      # 14. رفع APK كـ Artifact
      # ==========================================
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Signed-APK-Build-${{ github.run_number }}
          path: ${{ env.FINAL_APK }}
          if-no-files-found: error
