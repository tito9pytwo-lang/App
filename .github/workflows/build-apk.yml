name: Build & Sign Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # البحث عن المجلد الذي يحتوي على build.gradle.kts والعمل من داخله
      - name: Build and Sign APK
        run: |
          # البحث عن المجلد الذي يحتوي على ملفات المشروع
          PROJECT_DIR=$(dirname $(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1))
          echo "Working directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # إنشاء ملفات gradle الجاهزة
          gradle wrapper
          chmod +x gradlew

          # بناء المشروع
          ./gradlew assembleRelease

          # توقيع الـ APK
          keytool -genkeypair -v -keystore release.keystore -alias my-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass mypassword -keypass mypassword -dname "CN=Android, OU=Dev, O=App, L=City, S=State, C=US"
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" ! -name "*-signed.apk" | head -n 1)
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.keystore --ks-key-alias my-alias --ks-pass pass:mypassword --key-pass pass:mypassword --out app/build/outputs/apk/release/app-signed.apk $APK_PATH

          # نقل الـ APK الموقّع للمجلد الرئيسي للرفع
          cp app/build/outputs/apk/release/app-signed.apk $GITHUB_WORKSPACE/app-signed.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Signed-APK-Build-${{ github.run_number }}
          path: app-signed.apk
          
